<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" aria-labelledby="banner-title banner-desc">
<title id="banner-title">Affordance learning — Robots that learn what is possible</title>
<desc id="banner-desc">Original research-page illustration: a sphere and cylinder on a table surrounded by a perception, affordance, planning and action loop. Conceptual illustration, not experimental data.</desc>
<rect width="1100" height="460" rx="16" fill="#122e26"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="42" y="51" font-family="monospace" font-size="12" letter-spacing="1.5" fill="#abc3b6">KOVAN / ROSSI · METU · 2011–2013</text>
<text x="42" y="126" font-size="49" font-weight="700" letter-spacing="-1.6" fill="#f2f4e9">Robots that</text>
<text x="42" y="185" font-size="49" font-weight="700" letter-spacing="-1.6" fill="#f2f4e9">learn what</text>
<text x="42" y="244" font-size="49" font-weight="700" letter-spacing="-1.6" fill="#c5e9a5">is possible.</text>
<text x="42" y="302" font-size="17" fill="#bdd0c4">Affordance learning, grounded language,</text>
<text x="42" y="328" font-size="17" fill="#bdd0c4">and human-aware planning on iCub.</text>
<text x="42" y="389" font-family="monospace" font-size="12" fill="#91b29d">ROS · C++ · PCL · YARP · SVM</text>
<text x="42" y="423" font-family="monospace" font-size="10" fill="#91b29d">RESEARCH SOFTWARE / KADIR FIRAT UYANIK &amp; COLLABORATORS</text>
</g>
