name: RoboTurk ROS 2
on:
  push:
    paths: ["ros2/roboturk/**", ".github/workflows/roboturk-ros2.yml"]
  pull_request:
    paths: ["ros2/roboturk/**", ".github/workflows/roboturk-ros2.yml"]
defaults:
  run:
    working-directory: ros2/roboturk
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'src/roboturk_core[test]' ruff
      - run: python -m pytest -q
      - run: ruff check src tests scripts
  ros:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate generated ROS interfaces
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-numpy python3-pytest
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install
          source install/setup.bash
          python3 -m pytest -q tests/test_ros.py
