<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 910 410" role="img" aria-labelledby="title desc"><title id="title">Affordance and appearance representations for language</title><desc id="desc">Perceptual features branch into 48-dimensional and 8-dimensional affordance representations or a direct baseline, then label classifiers.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#cbd6d2"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#71847c" stroke-width="1.5"/></marker></defs><rect width="910" height="410" fill="#f4f7f4"/><rect width="910" height="410" fill="url(#grid)"/><text x="24" y="29" font-family="ui-monospace,monospace" font-size="11" fill="#52665d">THREE REPRESENTATIONS · ONE COMPARISON</text><a xlink:href="https://github.com/kadiru/metu-ros-pkg/blob/master/stacks/affordance_learning/al_perception/CMakeLists.txt" target="_blank"><g><rect x="28" y="162" width="175" height="78" rx="9" fill="#fff" stroke="#becbc4"/><rect x="28" y="174" width="3" height="54" rx="1.5" fill="#135e4b"/><text x="45" y="191" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#172f27">Object perception</text><text x="45" y="211" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">surface + spatial features</text><text x="45" y="225" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">Kinect / PCL</text></g></a><a xlink:href="https://github.com/kadiru/metu-ros-pkg/blob/master/stacks/affordance_learning/al_prediction/effect_predictor.cpp" target="_blank"><g><rect x="245" y="68" width="194" height="78" rx="9" fill="#fff" stroke="#becbc4"/><rect x="245" y="80" width="3" height="54" rx="1.5" fill="#135e4b"/><text x="262" y="97" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#172f27">Affordance prediction</text><text x="262" y="117" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">six behaviors × eight effects</text><text x="262" y="131" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">behavior-specific SVMs</text></g></a><g><rect x="487" y="45" width="180" height="78" rx="9" fill="#fff" stroke="#becbc4"/><rect x="487" y="57" width="3" height="54" rx="1.5" fill="#135e4b"/><text x="504" y="74" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#172f27">A48 descriptor</text><text x="504" y="94" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">48 confidences</text><text x="504" y="108" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">behavior is retained</text></g><g><rect x="487" y="156" width="180" height="78" rx="9" fill="#fff" stroke="#becbc4"/><rect x="487" y="168" width="3" height="54" rx="1.5" fill="#135e4b"/><text x="504" y="185" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#172f27">A8 descriptor</text><text x="504" y="205" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">8 maximum confidences</text><text x="504" y="219" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">behavior is collapsed</text></g><g><rect x="487" y="267" width="180" height="78" rx="9" fill="#fff" stroke="#becbc4"/><rect x="487" y="279" width="3" height="54" rx="1.5" fill="#135e4b"/><text x="504" y="296" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#172f27">Appearance baseline</text><text x="504" y="316" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">perceptual features</text><text x="504" y="330" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">direct label learning</text></g><a xlink:href="https://link.springer.com/chapter/10.1007/978-3-642-33093-3_33" target="_blank"><g><rect x="715" y="155" width="167" height="78" rx="9" fill="#fff" stroke="#becbc4"/><rect x="715" y="167" width="3" height="54" rx="1.5" fill="#135e4b"/><text x="732" y="184" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#172f27">Label prediction</text><text x="732" y="204" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">noun / adjective</text><text x="732" y="218" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">SVM comparison</text></g></a><path d="M203 201 H224 V107 H245" stroke="#71847c" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M439 107 H460 V84 H487" stroke="#71847c" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M460 107 V195 H487" stroke="#71847c" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M203 201 H224 V306 H487" stroke="#71847c" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M667 84 H690 V194 H715" stroke="#71847c" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M667 195 H690 V194 H715" stroke="#71847c" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M667 306 H690 V194 H715" stroke="#71847c" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><text x="28" y="385" font-family="system-ui,sans-serif" font-size="12" fill="#53645d">P2, Figure 1 and §§3.3–3.5. Verb labels describe observed effects; the learned object labels are adjectives and nouns.</text></svg>