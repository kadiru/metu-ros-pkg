ff" stroke="#becbc4"/><rect x="700" y="250" width="3" height="54" rx="1.5" fill="#135e4b"/><text x="717" y="267" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#172f27">Transceiver</text><text x="717" y="287" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">real or simulated bridge</text><text x="717" y="301" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">team commands</text></g></a><a xlink:href="https://download.tigers-mannheim.de/tdps/2011_TDP_RoboTurk.pdf" target="_blank"><g><rect x="471" y="238" width="185" height="78" rx="9" fill="#fff" stroke="#becbc4"/><rect x="471" y="250" width="3" height="54" rx="1.5" fill="#135e4b"/><text x="488" y="267" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#172f27">Robot control</text><text x="488" y="287" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">four omniwheels</text><text x="488" y="301" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">body twist → wheel speed</text></g></a><a xlink:href="https://github.com/kadiru/metu-ros-pkg/tree/master/stacks/robocup_ssl/ssl_wsim" target="_blank"><g><rect x="245" y="238" width="183" height="78" rx="9" fill="#fff" stroke="#becbc4"/><rect x="245" y="250" width="3" height="54" rx="1.5" fill="#135e4b"/><text x="262" y="267" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#172f27">Physical / simulated</text><text x="262" y="287" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">robot motion + local state</text><text x="262" y="301" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">Webots counterpart</text></g></a><path d="M792 148 V238" stroke="#71847c" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><text x="794" y="202" font-family="ui-monospace,monospace" font-size="11" fill="#53645d" text-anchor="middle">/team_command</text><path d="M700 277 H656" stroke="#71847c" fill="none" stroke-width="1.6"