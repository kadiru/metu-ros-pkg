ffect</text><text x="266" y="114" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">SVM per behavior</text><text x="266" y="128" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">entity + behavior → effect</text></g></a><a xlink:href="https://escholarship.org/uc/item/9cj412wg" target="_blank"><g><rect x="473" y="65" width="182" height="78" rx="9" fill="#fff" stroke="#becbc4"/><rect x="473" y="77" width="3" height="54" rx="1.5" fill="#135e4b"/><text x="490" y="94" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#172f27">Project future states</text><text x="490" y="114" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">effect prototypes</text><text x="490" y="128" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">0 / + / − / *</text></g></a><a xlink:href="https://escholarship.org/uc/item/9cj412wg" target="_blank"><g><rect x="697" y="65" width="182" height="78" rx="9" fill="#fff" stroke="#becbc4"/><rect x="697" y="77" width="3" height="54" rx="1.5" fill="#135e4b"/><text x="714" y="94" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#172f27">Search a plan</text><text x="714" y="114" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">breadth-first · horizon 3</text><text x="714" y="128" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">match demonstrated goal</text></g></a><path d="M207 104 H249" stroke="#71847c" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M431 104 H473" stroke="#71847c" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M655 104 H697" stroke="#71847c" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><a xlink:href="https://github.com/kadiru/metu-ros-pkg/tree/master/stacks/affordance_learning/al_behavior" target="_blank"><g><rect x="697" y="227" width="182" height="78" rx="9" fill="#fff" stroke="#becbc4"/><rect x="697" y="239" width="3" height="54" rx="1.5" fill="#135e4b"/><text x="714" y="256" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#172f27">Execute &amp; observe</text><text x="714" y="276" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">object or voice behavior</text><text x="714" y="290" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">expected vs. actual effect</text></g></a><a xlink:href="https://github.com/kadiru/metu-ros-pkg/blob/master/stacks/affordance_learning/al_memory/src/Memory.cpp" target="_blank"><g><rect x="249" y="227" width="406" height="78" rx="9" fill="#e6efe9" stroke="#becbc4"/><rect x="249" y="239" width="3" height="54" rx="1.5" fill="#135e4b"/><text x="266" y="256" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#172f27">Scene &amp; interaction state</text><text x="266" y="276" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">entities and feature vectors · working-memory queries</text><text x="266" y="290" font-family="ui-monospace,monospace" font-size="9" fill="#53645d">human assistance is part of the environment</text></g></a><path d="M788 143 V227" stroke="#71847c" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><text x="710" y="190" font-family="ui-monospace,monospace" font-size="11" fill="#53645d" text-anchor="middle">selected behavior</text><path d="M697 266 H655" stroke="#71847c" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M249 266 H116 V143" stroke="#71847c" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><text x="134" y="307" font-family="ui-monospace,monospace" font-size="11" fill="#53645d" text-anchor="middle">re-observe / replan</text><text x="25" y="353" font-family="system-ui,sans-serif" font-size="12" fill="#53645d">Derived from P1, methodology and Figures 3–4. Package links identify related implementation, not a verified reproduction.</text></svg>